version: 2

# Supply-chain hygiene for a deterministic, demo-safe portfolio app. Dependabot
# opens grouped weekly update PRs so dependency drift stays visible and
# reviewable. Updates are proposed only, never auto-merged, and the existing CI
# gates still run on every PR. No provider SDKs are introduced here.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk updates together to reduce PR noise.
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Core framework and toolchain packages move in lockstep and have breaking
    # major releases that require a deliberate, tested migration (for example
    # @clerk/nextjs 7 requires Next 15 or 16, and Tailwind 4 needs a config
    # rewrite). Major bumps for these are ignored here so they are never merged
    # automatically; do them by hand on a dedicated branch. Minor and patch
    # updates for these packages are still proposed.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@clerk/nextjs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
