name: CI

on:
  push:
  pull_request:

# A placeholder database URL for the whole job. Prisma needs the DATABASE_URL
# environment variable to resolve when it loads the datasource block, but none
# of the CI steps connect to a database: prisma validate only checks the schema
# and that the variable is well formed, prisma generate reads the schema, and
# the Next.js build does not query at build time. The value below is a syntactic
# placeholder that points at a non-existent host, not a real database and not a
# secret. PostgreSQL remains the production datasource provider.
env:
  DATABASE_URL: "postgresql://placeholder:placeholder@db.invalid:5432/signalflow?schema=public"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Supply-chain visibility. Audits production dependencies at high severity
      # and above, ignoring dev-only dependency noise. This step is reported but
      # non-blocking: the current advisories are upstream Next.js issues that are
      # only resolved by a major framework upgrade, which is tracked separately
      # in docs/TECHNICAL_DEBT_REGISTER.md. It runs no external scanner and makes
      # no network calls beyond the npm registry advisory database.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Safety scan
        run: npm run scan:safety

      - name: Architecture boundaries
        run: npm run check:architecture

      - name: Prisma schema validation
        run: npx prisma validate

      - name: Build
        run: npm run build
