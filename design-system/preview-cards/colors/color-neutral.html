<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../foundations/colors_and_type.css">
<style>
  body { margin:0; background:#fff; font-family:var(--font-sans); padding:26px 32px; color:var(--fg-1); }
  .grid { display:grid; grid-template-columns:repeat(8,1fr); gap:8px; }
  .sw { border-radius:9px; height:60px; border:1px solid rgba(11,27,54,.06); }
  .lab { font-family:var(--font-mono); font-size:9.5px; margin-top:6px; color:var(--fg-3); }
  .hex { font-family:var(--font-mono); font-size:8.5px; color:var(--fg-4); }
  h4 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-3); margin:0 0 14px; font-weight:600; }
  .cell span { display:block; }
</style></head>
<body>
  <h4>Neutral · slate scale</h4>
  <div class="grid">
    <div class="cell"><div class="sw" style="background:#F7F9FC"></div><span class="lab">50</span><span class="hex">F7F9FC</span></div>
    <div class="cell"><div class="sw" style="background:#F1F5F9"></div><span class="lab">100</span><span class="hex">F1F5F9</span></div>
    <div class="cell"><div class="sw" style="background:#E5EAF1"></div><span class="lab">200</span><span class="hex">E5EAF1</span></div>
    <div class="cell"><div class="sw" style="background:#CBD5E1"></div><span class="lab">300</span><span class="hex">CBD5E1</span></div>
    <div class="cell"><div class="sw" style="background:#94A3B8"></div><span class="lab">400</span><span class="hex">94A3B8</span></div>
    <div class="cell"><div class="sw" style="background:#64748B"></div><span class="lab">500</span><span class="hex">64748B</span></div>
    <div class="cell"><div class="sw" style="background:#475569"></div><span class="lab">600</span><span class="hex">475569</span></div>
    <div class="cell"><div class="sw" style="background:#0B1B36"></div><span class="lab">ink</span><span class="hex">0B1B36</span></div>
  </div>
</body></html>
