<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../foundations/colors_and_type.css">
<style>
  body { margin:0; background:#fff; font-family:var(--font-sans); padding:26px 32px; color:var(--fg-1); }
  h4 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-3); margin:0 0 18px; font-weight:600; }
  .pipe { display:flex; align-items:stretch; gap:0; }
  .stage { flex:1; text-align:center; position:relative; }
  .bar { height:8px; border-radius:99px; margin:0 3px; }
  .nm { font-size:11px; font-weight:600; margin-top:10px; color:var(--fg-1); }
  .hx { font-family:var(--font-mono); font-size:9px; color:var(--fg-4); margin-top:2px; }
  .dot { width:26px; height:26px; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-mono); font-size:11px; font-weight:600; }
</style></head>
<body>
  <h4>Signal → revenue pipeline sequence</h4>
  <div class="pipe">
    <div class="stage"><div class="dot" style="background:#0EA5E9">1</div><div class="bar" style="background:#0EA5E9"></div><div class="nm">Signal</div><div class="hx">#0EA5E9</div></div>
    <div class="stage"><div class="dot" style="background:#6366F1">2</div><div class="bar" style="background:#6366F1"></div><div class="nm">Intelligence</div><div class="hx">#6366F1</div></div>
    <div class="stage"><div class="dot" style="background:#2563EB">3</div><div class="bar" style="background:#2563EB"></div><div class="nm">AI</div><div class="hx">#2563EB</div></div>
    <div class="stage"><div class="dot" style="background:#D97706">4</div><div class="bar" style="background:#D97706"></div><div class="nm">Review</div><div class="hx">#D97706</div></div>
    <div class="stage"><div class="dot" style="background:#0891B2">5</div><div class="bar" style="background:#0891B2"></div><div class="nm">Workflow</div><div class="hx">#0891B2</div></div>
    <div class="stage"><div class="dot" style="background:#16A34A">6</div><div class="bar" style="background:#16A34A"></div><div class="nm">Revenue</div><div class="hx">#16A34A</div></div>
  </div>
</body></html>
