<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../foundations/colors_and_type.css">
<style>
  body { margin:0; background:#fff; font-family:var(--font-sans); padding:26px 32px; color:var(--fg-1); }
  .grid { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
  .sw { border-radius:10px; height:64px; border:1px solid rgba(11,27,54,.06); display:flex; align-items:flex-end; padding:8px; }
  .lab { font-family:var(--font-mono); font-size:10px; margin-top:6px; color:var(--fg-3); }
  .hex { font-family:var(--font-mono); font-size:9px; color:var(--fg-4); }
  h4 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-3); margin:0 0 14px; font-weight:600; }
  .cell span { display:block; }
</style></head>
<body>
  <h4>Brand &amp; primary blue</h4>
  <div class="grid">
    <div class="cell"><div class="sw" style="background:#EFF4FF"></div><span class="lab">blue-50</span><span class="hex">#EFF4FF</span></div>
    <div class="cell"><div class="sw" style="background:#DCE7FF"></div><span class="lab">blue-100</span><span class="hex">#DCE7FF</span></div>
    <div class="cell"><div class="sw" style="background:#BBD0FF"></div><span class="lab">blue-200</span><span class="hex">#BBD0FF</span></div>
    <div class="cell"><div class="sw" style="background:#2563EB"></div><span class="lab">brand-blue</span><span class="hex">#2563EB</span></div>
    <div class="cell"><div class="sw" style="background:#1D4ED8"></div><span class="lab">blue-hover</span><span class="hex">#1D4ED8</span></div>
    <div class="cell"><div class="sw" style="background:#0EA5E9"></div><span class="lab">signal-cyan</span><span class="hex">#0EA5E9</span></div>
  </div>
</body></html>
