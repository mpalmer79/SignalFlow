<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../foundations/colors_and_type.css">
<style>
  body { margin:0; background:#fff; font-family:var(--font-sans); padding:26px 32px; color:var(--fg-1); }
  h4 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-3); margin:0 0 16px; font-weight:600; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; max-width:560px; }
  label { font-size:12px; font-weight:500; color:var(--fg-2); display:block; margin-bottom:6px; }
  .inp { width:100%; height:40px; border:1px solid var(--border-strong); border-radius:8px; padding:0 12px; font-family:var(--font-sans); font-size:14px; color:var(--fg-1); box-sizing:border-box; background:#fff; }
  .inp::placeholder { color:var(--fg-4); }
  .inp.focus { border-color:var(--brand-blue); box-shadow:var(--shadow-focus); outline:none; }
  .sel { position:relative; }
  .sel svg { position:absolute; right:12px; top:12px; width:16px; height:16px; color:var(--fg-3); }
  .full { grid-column:1 / -1; }
</style></head>
<body>
  <h4>Form inputs</h4>
  <div class="grid">
    <div><label>Organization</label><input class="inp" value="Northeast Auto Group"></div>
    <div><label>Default channel</label><div class="sel"><input class="inp" value="SMS" readonly><i data-lucide="chevron-down"></i></div></div>
    <div class="full"><label>Search signals</label><div class="sel"><input class="inp focus" placeholder="Filter by customer, intent, or stage"><i data-lucide="search" style="left:auto"></i></div></div>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body></html>
