<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../foundations/colors_and_type.css">
<style>
  body { margin:0; background:#fff; font-family:var(--font-sans); padding:26px 32px; color:var(--fg-1); }
  h4 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-3); margin:0 0 18px; font-weight:600; }
  .meter-row { display:flex; flex-direction:column; gap:14px; max-width:560px; }
  .head { display:flex; justify-content:space-between; font-size:12px; margin-bottom:7px; }
  .head .k { color:var(--fg-3); }
  .head .v { font-weight:600; font-variant-numeric:tabular-nums; }
</style></head>
<body>
  <h4>Score &amp; confidence meters</h4>
  <div class="meter-row">
    <div><div class="head"><span class="k">Intent</span><span class="v">92</span></div><div class="sf-meter"><span style="width:92%;background:var(--brand-blue)"></span></div></div>
    <div><div class="head"><span class="k">Opportunity</span><span class="v">74</span></div><div class="sf-meter"><span style="width:74%;background:var(--success)"></span></div></div>
    <div><div class="head"><span class="k">Engagement</span><span class="v">58</span></div><div class="sf-meter"><span style="width:58%;background:var(--warning)"></span></div></div>
    <div><div class="head"><span class="k">AI confidence</span><span class="v">87%</span></div><div class="sf-meter" style="height:6px"><span style="width:87%;background:var(--brand-blue)"></span></div></div>
  </div>
</body></html>
