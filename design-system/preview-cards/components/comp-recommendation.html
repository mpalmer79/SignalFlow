<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../foundations/colors_and_type.css">
<style>
  body { margin:0; background:var(--bg-canvas); font-family:var(--font-sans); padding:24px 28px; color:var(--fg-1); }
  .card { background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-sm); padding:18px; max-width:340px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .title { font-size:14px; font-weight:600; }
  .sub { font-size:12px; color:var(--fg-3); margin-top:2px; }
  .conf { margin:14px 0 12px; }
  .conf .h { display:flex; justify-content:space-between; font-size:11px; color:var(--fg-3); margin-bottom:6px; }
  .conf .h b { color:var(--fg-1); font-variant-numeric:tabular-nums; }
  .foot { display:flex; justify-content:space-between; align-items:center; }
  .meta { font-size:11px; color:var(--fg-4); }
</style></head>
<body>
  <div class="card">
    <div class="top">
      <div><div class="title">Send service-recall follow-up</div><div class="sub">Maria Alvarez · automotive</div></div>
      <span class="sf-badge sf-badge-warning">Pending review</span>
    </div>
    <div class="conf">
      <div class="h"><span>Confidence</span><b>87</b></div>
      <div class="sf-meter" style="height:6px"><span style="width:87%;background:var(--brand-blue)"></span></div>
    </div>
    <div class="foot">
      <span class="sf-badge sf-badge-success">High confidence</span>
      <span class="meta">2h ago</span>
    </div>
  </div>
</body></html>
