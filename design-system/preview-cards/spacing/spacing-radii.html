<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../foundations/colors_and_type.css">
<style>
  body { margin:0; background:#fff; font-family:var(--font-sans); padding:26px 32px; color:var(--fg-1); }
  h4 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-3); margin:0 0 18px; font-weight:600; }
  .row { display:flex; gap:22px; }
  .cell { text-align:center; }
  .box { width:74px; height:62px; background:var(--blue-50); border:1.5px solid var(--brand-blue); }
  .lab { font-size:11px; font-weight:600; margin-top:8px; }
  .px { font-family:var(--font-mono); font-size:10px; color:var(--fg-4); }
</style></head>
<body>
  <h4>Corner radii</h4>
  <div class="row">
    <div class="cell"><div class="box" style="border-radius:6px"></div><div class="lab">xs</div><div class="px">6px</div></div>
    <div class="cell"><div class="box" style="border-radius:8px"></div><div class="lab">sm · inputs</div><div class="px">8px</div></div>
    <div class="cell"><div class="box" style="border-radius:10px"></div><div class="lab">md</div><div class="px">10px</div></div>
    <div class="cell"><div class="box" style="border-radius:12px"></div><div class="lab">lg · cards</div><div class="px">12px</div></div>
    <div class="cell"><div class="box" style="border-radius:16px"></div><div class="lab">xl</div><div class="px">16px</div></div>
    <div class="cell"><div class="box" style="border-radius:99px"></div><div class="lab">full · pills</div><div class="px">9999</div></div>
  </div>
</body></html>
