<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../foundations/colors_and_type.css">
<style>
  body { margin:0; background:#fff; font-family:var(--font-sans); padding:26px 32px; color:var(--fg-1); }
  h4 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-3); margin:0 0 18px; font-weight:600; }
  .row { display:flex; align-items:flex-end; gap:14px; }
  .cell { text-align:center; }
  .bar { background:var(--brand-blue); border-radius:3px; width:30px; }
  .lab { font-family:var(--font-mono); font-size:10px; color:var(--fg-3); margin-top:8px; }
</style></head>
<body>
  <h4>Spacing scale · 4px base</h4>
  <div class="row">
    <div class="cell"><div class="bar" style="height:4px"></div><div class="lab">1·4</div></div>
    <div class="cell"><div class="bar" style="height:8px"></div><div class="lab">2·8</div></div>
    <div class="cell"><div class="bar" style="height:12px"></div><div class="lab">3·12</div></div>
    <div class="cell"><div class="bar" style="height:16px"></div><div class="lab">4·16</div></div>
    <div class="cell"><div class="bar" style="height:20px"></div><div class="lab">5·20</div></div>
    <div class="cell"><div class="bar" style="height:24px"></div><div class="lab">6·24</div></div>
    <div class="cell"><div class="bar" style="height:32px"></div><div class="lab">8·32</div></div>
    <div class="cell"><div class="bar" style="height:48px"></div><div class="lab">12·48</div></div>
    <div class="cell"><div class="bar" style="height:64px"></div><div class="lab">16·64</div></div>
    <div class="cell"><div class="bar" style="height:80px"></div><div class="lab">20·80</div></div>
  </div>
</body></html>
