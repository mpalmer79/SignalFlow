<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../foundations/colors_and_type.css">
<style>
  body { margin:0; background:var(--bg-canvas); font-family:var(--font-sans); padding:30px 32px; color:var(--fg-1); }
  h4 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-3); margin:0 0 22px; font-weight:600; }
  .row { display:flex; gap:26px; }
  .cell { text-align:center; }
  .box { width:96px; height:64px; background:#fff; border:1px solid var(--border); border-radius:12px; }
  .lab { font-size:11px; font-weight:600; margin-top:12px; }
  .px { font-family:var(--font-mono); font-size:9.5px; color:var(--fg-4); }
</style></head>
<body>
  <h4>Elevation · light-theme shadow ramp</h4>
  <div class="row">
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="lab">xs</div><div class="px">subtle lift</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lab">sm · cards</div><div class="px">default</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lab">md</div><div class="px">popover</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lab">lg · hover</div><div class="px">menus</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="lab">xl</div><div class="px">modal</div></div>
  </div>
</body></html>
