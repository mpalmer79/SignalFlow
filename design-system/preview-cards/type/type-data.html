<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../foundations/colors_and_type.css">
<style>
  body { margin:0; background:#fff; font-family:var(--font-sans); padding:28px 32px; color:var(--fg-1); display:flex; gap:40px; align-items:center; }
  .tag { font-family:var(--font-mono); font-size:11px; color:var(--fg-4); margin-bottom:8px; }
  .metric-row { display:flex; gap:32px; }
  .metric { display:flex; flex-direction:column; }
  .mono-block { background:var(--bg-inset); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
</style></head>
<body>
  <div>
    <div class="tag">metric · Geist 600 · tabular</div>
    <div class="metric-row">
      <div class="metric"><span class="sf-metric">$1.24M</span><span class="sf-small">Revenue influenced</span></div>
      <div class="metric"><span class="sf-metric">87</span><span class="sf-small">Avg confidence</span></div>
    </div>
  </div>
  <div>
    <div class="tag">mono · Geist Mono</div>
    <div class="mono-block">
      <div class="sf-mono">signal_id: sig_8f21a&nbsp;&nbsp;intent: 92</div>
      <div class="sf-mono">consent: allowed&nbsp;&nbsp;&nbsp;&nbsp;stage: review</div>
    </div>
  </div>
</body></html>
